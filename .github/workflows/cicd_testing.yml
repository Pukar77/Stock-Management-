name: Stock Management Backend

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # 3. Create virtual environment
      - name: Create virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          source venv/bin/activate
          pip install -r requirements.txt

      # 5. Set Django environment variables
      - name: Set environment variables
        run: |
          echo "DJANGO_SETTINGS_MODULE=stock_management.settings" >> $GITHUB_ENV
          echo "DEBUG=False" >> $GITHUB_ENV

      # 6. Create .env file from GitHub Secret
      - name: Create .env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE" > .env

      # 7. Run Django system checks
      - name: Django checks
        working-directory: ./backend
        run: |
          source ../venv/bin/activate
          python manage.py check

      # 8. Run database migrations
      - name: Run migrations
        working-directory: ./backend
        run: |
          source ../venv/bin/activate
          python manage.py migrate --noinput

      # 9. Run tests
      - name: Run tests
        working-directory: ./backend
        run: |
          source ../venv/bin/activate
          python manage.py test

      # 10. Start backend
      - name: Start backend
        working-directory: ./backend
        run: |
          nohup ../venv/bin/python manage.py runserver 0.0.0.0:8000 > backend.log 2>&1 &

      # 11. Verify backend
      - name: Verify backend
        working-directory: ./backend
        run: |
          sleep 5
          curl --fail http://127.0.0.1:8000/ || (
            cat backend.log
            exit 1
          )