name: Stock Management Backend

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    # Temporary PostgreSQL database for CI
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stock_management_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # 3. Check Python version
      - name: Check Python version
        run: |
          python --version
          which python

      # 4. Create virtual environment
      - name: Create virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip

      # 5. Install dependencies
      - name: Install dependencies
        run: |
          source venv/bin/activate
          pip install -r requirements.txt

      # 6. Create CI .env file
      - name: Create CI environment file
        run: |
          cat > .env << 'EOF'
          DB_NAME=stock_management_test
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=localhost
          DB_PORT=5432
          EOF

      # 7. Set Django environment variables
      - name: Set environment variables
        run: |
          echo "DJANGO_SETTINGS_MODULE=stock_management.settings" >> $GITHUB_ENV
          echo "DEBUG=False" >> $GITHUB_ENV

      # 8. Run Django system checks
      - name: Django checks
        working-directory: ./backend
        run: |
          source ../venv/bin/activate
          python manage.py check

      # 9. Run database migrations
      - name: Run migrations
        working-directory: ./backend
        run: |
          source ../venv/bin/activate
          python manage.py migrate --noinput

      # 10. Run tests
      - name: Run tests
        working-directory: ./backend
        run: |
          source ../venv/bin/activate
          python manage.py test

      # 11. Start backend
      - name: Start backend
        working-directory: ./backend
        run: |
          nohup ../venv/bin/python manage.py runserver 0.0.0.0:8000 > backend.log 2>&1 &

      # 12. Verify backend
      - name: Start backend
        working-directory: ./backend
        run: |
          nohup ../venv/bin/python manage.py runserver 0.0.0.0:8000 > backend.log 2>&1 &

          sleep 5

          if grep -q "Starting development server" backend.log; then
            echo "Backend started successfully."
          else
            echo "Backend failed to start."
            cat backend.log
            exit 1
          fi